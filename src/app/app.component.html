<a class="skip" href="/" (click)="skipToContent($event)">Skip to content</a>

<app-dotted-surface />
<app-cursor />

@if (showLoader()) {
  <div class="loader" #loader role="status" aria-live="polite" aria-label="Loading Neurix portal">
    <div class="loader__inner">
      <app-spiral-animation [progress]="progress()" />
      <div class="loader__brand nx-gradient-text">{{ site.brand }}</div>
      <div class="loader__status nx-mono">{{ status() }}…</div>
      <div class="loader__bar"><span [style.transform]="'scaleX(' + progress() + ')'"></span></div>
      <button type="button" class="loader__skip nx-mono" (click)="skipIntro()">Skip intro</button>
    </div>
  </div>
}

<app-navbar />

<main id="main" #main tabindex="-1" class="main">
  <router-outlet />
</main>

<app-footer />

<button type="button" class="to-top" [class.to-top--show]="showTop()" (click)="toTop()" aria-label="Back to top" [attr.tabindex]="showTop() ? 0 : -1">
  <app-icon name="arrow-up" />
</button>
